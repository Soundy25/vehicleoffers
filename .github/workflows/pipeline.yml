# .github/workflows/pipeline.yml [MODIFIED]
name: Vehicle Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-secure-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Hermetic Docker Container
        run: |
          docker build -t vehicle-scraper:latest .

      - name: Run Static Analysis (mypy) inside Container
        run: |
          docker run --rm vehicle-scraper:latest mypy .

      - name: Run Unit & E2E Tests (pytest) inside Container
        run: |
          docker run --rm \
            -e API_SECRET="${{ secrets.API_SECRET }}" \
            -e WEB_APP_URL="${{ secrets.WEB_APP_URL }}" \
            vehicle-scraper:latest pytest --maxfail=1 --disable-warnings

      - name: Verify Playwright Runtime Parity
        run: |
          docker run --rm vehicle-scraper:latest python -c "import playwright; print('Playwright Python Runtime Verified')"